<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta - Orientador Vocacional UPB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="nav" id="nav"></header>
<div class="form-card">
    <h2>Crear tu cuenta</h2>
    <p class="sub">Para guardar tus resultados y hacer el test vocacional.</p>

    <form id="formRegistro">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" required>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" required>
        <small>Mínimo 8 caracteres, 1 mayúscula y 1 número.</small>

        <div id="mensajeError"></div>

        <button type="submit" class="btn block" style="margin-top:20px">Registrarme</button>
    </form>

    <p style="margin-top:18px;text-align:center;color:#5b6190">¿Ya tienes cuenta? <a href="login.html" style="color:var(--blue);font-weight:700">Inicia sesión</a></p>
</div>
<script src="js/sesion.js"></script>
<script>pintarNav();</script>
<script src="js/registro.js"></script>
</body>
</html>
