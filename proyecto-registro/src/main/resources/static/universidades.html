<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Universidades de Antioquia - Orientador Vocacional UPB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="nav" id="nav"></header>
<main class="wrap">
    <h1 style="margin:28px 0 8px">Universidades de Antioquia</h1>
    <p style="color:#5b6190;margin-bottom:20px">
        Consulta las instituciones de educación superior del departamento. Las que dicen
        "Información completa" tienen carreras y plan de estudios disponibles en la aplicación.
    </p>

    <div class="buscador">
        <label for="buscadorUniversidades">Buscar por nombre</label>
        <input type="text" id="buscadorUniversidades" placeholder="Ejemplo: Bolivariana, EAFIT, Antioquia..." autocomplete="off">
        <small id="contadorUniversidades" aria-live="polite"></small>
    </div>

    <div id="listaUniversidades" class="grid-cards"></div>
</main>
<footer class="pie">Orientador Vocacional UPB · Proyecto académico</footer>
<script src="js/utilidadesDom.js"></script>
<script src="js/sesion.js"></script>
<script src="js/universidades.js"></script>
</body>
</html>
