<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Vocacional - Orientador Vocacional UPB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="nav" id="nav"></header>

<main class="wrap" id="pantallaTest" style="max-width:600px">
    <div class="bar" style="margin-top:20px">
        <div><b id="textoProgreso">0 de 0 preguntas respondidas</b></div>
        <span><i id="barraProgreso" style="width:0%"></i></span>
    </div>

    <div class="card">
        <h3 id="pregunta">Cargando pregunta...</h3>
        <div id="opciones" style="margin-top:14px"></div>
        <div id="avisoError"></div>
    </div>

    <div style="display:flex;justify-content:space-between;margin-top:10px">
        <button id="btnAnterior" class="btn outline">Anterior</button>
        <button id="btnSiguiente" class="btn">Siguiente</button>
    </div>
</main>

<div id="pantallaCarga" class="pantalla-carga">
    <div class="spinner"></div>
    <p>Calculando tu resultado...</p>
</div>

<script src="js/sesion.js"></script>
<script>
    requerirSesion();
    pintarNav();
</script>
<script src="js/barraProgreso.js"></script>
<script src="js/test.js"></script>
</body>
</html>
