<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Vocacional - Orientador Vocacional UPB</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }

        /* Barra de progreso: tarea tecnica "calcular el porcentaje de
           avance" + "actualizar el indicador al avanzar/retroceder" */
        #contenedorProgreso { background: #e0e0e0; border-radius: 8px; height: 14px; margin-bottom: 8px; }
        #barraProgreso { background: #4caf50; height: 100%; border-radius: 8px; width: 0%; transition: width 0.2s; }
        #textoProgreso { text-align: center; font-size: 14px; color: #555; margin-bottom: 24px; }

        #pregunta { font-weight: bold; margin-bottom: 12px; }
        .opcion { display: block; margin: 8px 0; }

        #avisoError { color: red; min-height: 20px; }

        .botones { display: flex; justify-content: space-between; margin-top: 20px; }
        button { padding: 10px 16px; }

        /* Pantalla de carga: tarea tecnica "mostrar una pantalla de
           carga mientras se calcula el resultado". Se muestra/oculta
           desde test.js cambiando "display". */
        #pantallaCarga {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            align-items: center; justify-content: center;
            font-size: 18px; font-weight: bold;
        }

        #pantallaResultado { display: none; }
        #listaResultado { list-style: none; padding: 0; }
        #listaResultado li { padding: 6px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <h2>Test Vocacional</h2>

    <div id="pantallaTest">
        <div id="contenedorProgreso">
            <div id="barraProgreso"></div>
        </div>
        <div id="textoProgreso">0 de 0 preguntas respondidas</div>

        <p id="pregunta">Cargando pregunta...</p>
        <div id="opciones"></div>

        <p id="avisoError"></p>

        <div class="botones">
            <button id="btnAnterior">Anterior</button>
            <button id="btnSiguiente">Siguiente</button>
        </div>
    </div>

    <div id="pantallaResultado">
        <h3>¡Test completado!</h3>
        <p>Este es tu puntaje por área de interés:</p>
        <ul id="listaResultado"></ul>
    </div>

    <div id="pantallaCarga">Calculando tu resultado...</div>

    <script src="js/barraProgreso.js"></script>
    <script src="js/test.js"></script>
    
</body>
</html>
